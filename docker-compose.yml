version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: voice_clone_db
      POSTGRES_USER: voice_user
      POSTGRES_PASSWORD: voice_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://voice_user:voice_password@postgres:5432/voice_clone_db
      - REDIS_URL=redis://redis:6379
      - PUBLIC_STREAMING_ENABLED=true
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    volumes:
      # Only mount model/audio data — NOT the full source tree.
      # Mounting ./backend:/app overwrites the image's pip-installed packages
      # with the host filesystem, causing ModuleNotFoundError at runtime.
      - voice_models:/app/models
      - voice_audio:/app/audio

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
        # They must be passed as build args, not runtime env vars.
        - NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyD0IMlZnUAjBwP-KStrtrnaTZKLtGiC7kI
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=voice-clone-platform.firebaseapp.com
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=voice-clone-platform
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=voice-clone-platform.firebasestorage.app
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=492840920749
        - NEXT_PUBLIC_FIREBASE_APP_ID=1:492840920749:web:27916572eb4e0d2b74c824
        - NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-0Y5CS2ZMTX
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  gateway:
    build: ./network-gateway
    ports:
      - "8080:8080"
    environment:
      - VCAAS_BACKEND_WS_URL=ws://backend:8000/api/v1/verify/stream
      - PORT=8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  voice_models:
  voice_audio:

